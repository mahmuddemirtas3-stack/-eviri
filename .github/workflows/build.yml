name: Oyunca APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'oyunca2-*.zip'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Momiji kaynağını indir
        run: git clone --depth 1 --recurse-submodules https://github.com/yazanj082/momiji.git momiji
      - name: Araçlar
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-protobuf protobuf-compiler
          pip install --break-system-packages grpcio-tools protobuf || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Yamayı uygula
        run: |
          unzip -o 'oyunca2-*.zip' -d momiji
          cd momiji
          python3 patch.py
      - name: Derle
        working-directory: momiji/android
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Oyunca-apk
          path: momiji/android/app/build/outputs/apk/**/*.apk

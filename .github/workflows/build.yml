name: Oyunca APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'oyunca2-*.zip'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Momiji kaynağını indir
        run: git clone --depth 1 --recurse-submodules https://github.com/yazanj082/momiji.git momiji
      - name: Araçlar
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-protobuf protobuf-compiler
          pip install --break-system-packages grpcio-tools protobuf || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Yamayı uygula
        env:
          OYUNCA_GEMINI_KEY: ${{ secrets.OYUNCA_GEMINI_KEY }}
          OYUNCA_DEEPL_KEY: ${{ secrets.OYUNCA_DEEPL_KEY }}
          OYUNCA_CLAUDE_KEY: ${{ secrets.OYUNCA_CLAUDE_KEY }}
        run: |
          unzip -o 'oyunca2-*.zip' -d momiji
          cd momiji
          python3 patch.py
      - name: İmza anahtarı
        env:
          KS_B64: ${{ secrets.OYUNCA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OYUNCA_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > momiji/android/oyunca.jks
            printf 'chiakiKeystore=%s\nchiakiKeystorePW=%s\nchiakiKeyAlias=oyunca\nchiakiKeyPW=%s\n' "$PWD/momiji/android/oyunca.jks" "$KS_PASS" "$KS_PASS" > momiji/android/local.properties
          fi
      - name: Derle
        working-directory: momiji/android
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Oyunca-apk
          path: momiji/android/app/build/outputs/apk/**/*.apk
